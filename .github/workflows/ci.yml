# CI —— 每次推上来立刻知道坏没坏（v0.4.0）
#
# 为什么要有它：在这个仓库里，判断"刚改的东西有没有把别处弄坏"原来只有一条路 ——
# 手动跑全量回归，33 分钟。于是改一行小东西的人（也就是作者自己）会倾向于"先不跑"，
# 而那正是静默 bug 溜进来的方式。
#
# 定位说清楚：
#   · 这里【不是】给陌生人看信用的，是给作者自己用的"改完立刻知道"。
#   · 全量那一批需要真实模型的 key（DSH_API_KEY），不进 CI（数量以 tools/run-regression.ps1 报的套数为准）。
#     这里只跑【不需要任何 key】的那一批 —— 它们自己假造 API 或者压根不联网。
#   · GitHub 的 windows 镜像自带 Chrome，而且路径正好是各套件里写死的那个
#     （C:\Program Files\Google\Chrome\Application\chrome.exe），所以直接能用。
name: CI

on:
  push:
    branches: [main]
    # v0.5.8.2：纯文档改动不再触发那 20 分钟。
    # 拦的是「改了 CHANGELOG / README / PROGRESS / docs 也要跑全量 48 套」——
    # 这条线上已经有过 6 笔纯文档提交各烧掉一轮 CI，比缺套件更浪费。
    # 只在【所有】改动文件都匹配时才跳过；同时改了代码就照跑。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    # v0.5.5.1：从 25 提到 40 —— 清单里加了 7 套（star/stop/segrewrite/memreview/reflect/chatsearch/contattach）
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装依赖
        run: npm ci --no-audit --no-fund

      - name: 静态检查（语法错 / 文件齐不齐 / 版本号一致）
        run: node tools/ci-check.mjs

      # 这一批全部【不需要真 key】：要么是纯函数（node 直接 import），
      # 要么自己拦截请求假造一个模型回复。
      - name: e2e（不依赖真实 key 的套件，清单在下面 $suites 里）
        shell: pwsh
        run: |
          $suites = @(
            'e2e-stregex','e2e-stchat','e2e-ccv3','e2e-autobackup',
            'e2e-v040card','e2e-v040fix','e2e-cardfields','e2e-group','e2e-group2','e2e-group3',
            'e2e-grouppages','e2e-groupmem','e2e-groupspeak',
            'e2e-wbimport2',
            'e2e-nav','e2e-menu','e2e-empty','e2e-appearance','e2e-ellipsis',
            'e2e-i18n','e2e-privacy',
            # 剧情卡（v0.5.0 起的主线）：自己假造 SSE，不需要真 key
            'e2e-arc',
            # 非破坏分支（v0.5.4）：老数据串链 / 重聊不删 / 切走向
            'e2e-branch',
            # 分支面板（v0.5.4）：提示条 / 面板列出每个岔路口 / 切过去 /
            # 断链（parentId 是空串）的老数据要接回一条线。
            'e2e-branchui',
            # 长篇档与反客服腔（v0.5.5）：提示词与 max_tokens
            'e2e-epic',
            # v0.5.1.7 四条止血的真行为验证：切支归档对称 / 清空聊天重置剧情卡进度 /
            # 自动续写刹车 / 阅读模式外壳。全部点界面 + 读回 IndexedDB，不 grep 源码。
            'e2e-v517',
            # 小说层（v0.5.2）：开戏 → 分拍 → 逐拍写 → 场记 → 书架 → 阅读页 → 删除。
            # 假 SSE 按 system 内容分流（正文流 / 分拍 JSON / 场记 JSON / 临时人物 JSON）。
            'e2e-scene',
            # 小说底色（v0.5.2.5）：块级装配 / 按句截 / 真实长卡的人设·卡字段·范例·
            # 称呼·记忆都真的进了正文提示词；关键词型世界书靠场景卡的地点和时间命中。
            'e2e-scenectx',
            # 小说场记闭环（v0.5.3）：结束页摊开场记 / 记进记忆是 draft / 存进设定补记得
            # 真的进聊天提示词 / 装不下时先丢世界书与记忆。
            'e2e-scenelog',
            # 记忆 OS：待确认的记忆绝不注入 / 收下就注入 / 不收就软删 /
            # 「这一轮用了什么」把 used 与 dropped 都摊开 / 「看原话」跳回来源。
            'e2e-memos',
            # 首次使用的路（v0.5.3.2）：零角色空状态 → 示例卡 → 配 Key 的半屏 sheet →
            # 测试连接的失败分类；以及输入草稿的存/恢复/清。自己假造 SSE，不要真 key。
            'e2e-firstrun',
            # 风格卡（v0.5.3.2）：样例 + 禁用词进【表达方式】末尾、洗脏数据、走界面存进库、导出带卡。
            'e2e-stylecard',
            # 突发情况（v0.5.4）：连点 / 停止 / 切角色 / 断流 / 断网 / 流里掺坏 JSON /
            # 八千字 / 连切八次 / 生成到一半刷新。九种全是劫持 fetch 造假，0 费用。
            'e2e-chaos',
            # ---- v0.5.5.1 补进清单的 7 套 ----
            # 原来这 7 套只靠本地 run-regression 跑。e2e-reflect 头里写「不进 CI 清单（要启浏览器）」
            # 的理由不成立 —— 上面那 33 套全都要启浏览器。
            'e2e-star',        # 正文渲染：星号四形态 + 颜文字 + 括号预挖
            'e2e-stop',        # 停止/中断：半截回复的去向
            'e2e-segrewrite',  # 从这段起重写
            'e2e-memreview',   # 记忆写入前的方向复核
            'e2e-reflect',     # 周期性反思
            'e2e-chatsearch',  # 全库搜索
            'e2e-contattach',  # 续写契约（不落用户消息）
            # ---- v0.5.5.2 补进清单的 2 套 ----
            # 这两套是【卡片导入导出】最直接的配套，却一直只在本地跑。
            # e2e-ccsync 头里就记着：v1.21.52 那个「导入任何卡都崩」的致命 bug，
            # 是 97 套回归全绿时漏过去的，因为它不在任何清单里。
            'e2e-ccsync',      # 角色卡字段 ↔ 角色对象双向同步（42 项）
            'e2e-cardio',      # 点设置页入口 → 选 .json → 角色真的被建出来（16 项）
            # ---- v0.5.8.2 起补进清单的 6 套 ----
            # 都是纯 Node、不启浏览器、几秒跑完 —— 是 CI 里最便宜的一层保护。
            # e2e-v58fix 从 0.5.8.1 起就只在本地跑，e2e-v59beat 是 0.5.8.2 新写的，
            # e2e-v583pov 是 0.5.8.3 新写的，e2e-v584life 是 0.5.8.4 新写的，
            # e2e-v585gap 是 0.5.8.5 新写的，e2e-v586quote 是 0.5.8.6 新写的；
            # 六套都验证过「本地全量里有它、CI 清单里没有」这个缺口。
            'e2e-v58fix',      # 自动备份取最近一份：跨目录比日期 / 读坏了往下试（21 项）
            'e2e-v59beat',     # 分段提示词必须读到素材（11 项）
            'e2e-v583pov',     # 视角说明无「她」+ 镜头层数锚点（13 项）
            'e2e-v584life',    # 作息表能改能关 / 位置提取 now 三处登记（41 项）
            'e2e-v585gap',     # 时间差的模糊档：跨时段给说法、且一个数字都不带（16 项）
            'e2e-v586quote'    # 引号格式：提示词/渲染/朗读 + cliche 不再静默失效 + 界面文案（36 项）
          )
          # 五种汇总格式（各套件不同时期写的，没统一过）—— 和 tools/run-regression.ps1 同一份判据
          # ⚠️ 两处必须一起改：这一份和 run-regression.ps1:70 起那几行是【两份独立实现】。
          #    第四、五种是 0.5.8.3 补的（channel / writer / viewmode 三套一直在漏），
          #    tools/ci-check.mjs 第 6 项会扫全仓库，防止再冒出第六种。
          function Test-HasSummary($text) {
            if ($text -match 'pass=(\d+)\s+fail=(\d+)') { return $true }
            if ($text -match '通过\s+(\d+)\s*项[^0-9]*失败\s+(\d+)') { return $true }
            if ($text -match '通过\s+(\d+)\s*/\s*失败\s+(\d+)') { return $true }
            if ($text -match '(\d+)\s*项?\s*通过\s*[/／]\s*(\d+)\s*项?\s*失败') { return $true }
            if ($text -match '通过\s+(\d+)\s*项\s*[/／]\s*失败\s+(\d+)\s*项?') { return $true }
            return $false
          }
          $fail = 0
          foreach ($s in $suites) {
            Write-Host "--- $s"
            $tmp = Join-Path $env:RUNNER_TEMP "$s.out"
            node "e2e/$s.mjs" *> $tmp
            $code = $LASTEXITCODE
            $out = if (Test-Path $tmp) { Get-Content $tmp -Raw -Encoding UTF8 } else { '' }
            Write-Host $out
            # 崩溃重试（v0.5.8.2 补）：和 tools/run-regression.ps1:86 同一个判据 ——
            # 【没有汇总行且退出码非 0】= 它在 puppeteer 层崩的（Navigation timeout /
            # detached Frame 那一类），整轮跑时会偶发，重试一次有意义；
            # 【断言失败绝不重试】—— 那有汇总行，是真信号，不会走到这个分支。
            # 原来 CI 里是裸 node：本地有兜底、线上没有，所以每次都得人肉重跑。
            if ($code -ne 0 -and -not (Test-HasSummary $out)) {
              Write-Host "::warning title=崩溃重试::$s 没有汇总行且退出码 $code —— 按 puppeteer 层崩溃重试一次"
              node "e2e/$s.mjs" *> $tmp
              $code = $LASTEXITCODE
              $out = if (Test-Path $tmp) { Get-Content $tmp -Raw -Encoding UTF8 } else { '' }
              Write-Host $out
            }
            Remove-Item $tmp -Force -ErrorAction SilentlyContinue
            # 红的时候让 annotation 直接写出是哪一套：否则页面上只有
            # 「Process completed with exit code 1.」，得下载整份日志才知道谁挂的
            # （v0.5.0 / v0.5.1 两轮都是这么查的）。
            if ($code -ne 0) {
              $fail++
              Write-Host "::error title=e2e 失败::e2e/$s.mjs 退出码 $code"
            }
          }
          Write-Host "失败的套件数：$fail / $($suites.Count)"
          if ($fail -gt 0) { exit 1 }
